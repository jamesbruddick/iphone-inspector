[package]
name = "iphone-inspector"
version = "4.0.1"
edition = "2024"
# The floor set by tray-icon and muda; CI builds on it so it stays true.
rust-version = "1.90"
description = "Tray app that shows every stat a connected iPhone reports over USB, in a local web page."
license = "MIT"
build = "build.rs"

[dependencies]
# Only what the local API uses: the HTTP/1 server, JSON bodies and query strings.
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
notify-rust = "4.18.0"
open = "5.4.4"
plist = "1.10.1"
# The iPhone client in src/idevice: TLS and pairing certificates, all Rust (ring for the crypto).
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rsa = { version = "0.9.10", features = ["getrandom"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tao = "0.37.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
# No libxdo: the menu has no keyboard shortcuts, and it is one fewer system library on Linux.
tray-icon = { version = "0.25.1", default-features = false, features = ["libappindicator"] }

# Start at Login; see src/autostart.rs. Linux writes its own autostart entry.
[target.'cfg(not(target_os = "linux"))'.dependencies]
auto-launch = "0.6.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
smappservice-rs = "0.1.3"

# The .exe's icon and file details; see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

# Key generation for pairing is slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

# The Linux package, built by `cargo deb` in the release workflow.
[package.metadata.deb]
maintainer = "James B Ruddick"
copyright = "2026, James B Ruddick"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
A tray app that shows every stat a USB-connected iPhone reports - model, identifiers, battery \
health and cycles, storage, software and cellular details - in a local web page. Everything stays \
on this computer."""
# $auto covers the libraries the binary links. The AppIndicator library is loaded at run time, so it
# is named here, along with the USB service the app talks to the phone through.
depends = "$auto, usbmuxd, libayatana-appindicator3-1"
assets = [
    ["target/release/iphone-inspector", "usr/bin/", "755"],
    ["assets/linux/iphone-inspector.desktop", "usr/share/applications/", "644"],
    ["assets/linux/icons/16x16/iphone-inspector.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["assets/linux/icons/24x24/iphone-inspector.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["assets/linux/icons/32x32/iphone-inspector.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["assets/linux/icons/48x48/iphone-inspector.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["assets/linux/icons/64x64/iphone-inspector.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["assets/linux/icons/128x128/iphone-inspector.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["assets/linux/icons/256x256/iphone-inspector.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["assets/linux/icons/512x512/iphone-inspector.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["README.md", "usr/share/doc/iphone-inspector/", "644"],
]
